name: enable-pages
on: push
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site (branch: main / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          code=$(curl -sS -o out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "HTTP $code"; cat out.json
          test "$code" = "201" -o "$code" = "409" -o "$code" = "422"
